<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acompanhar pedido | Gabora Scoop</title><link rel="stylesheet" href="/assets/styles.css"></head><body><div class="topbar">Acompanhe a preparação e o envio do seu scoop</div><header class="header"><div class="header-main"><a class="logo" href="/"><img src="/assets/logo.jfif" alt="Logo">GABORA SCOOP</a><div></div><div class="header-actions"><a class="icon-btn" href="/">Loja</a><a class="icon-btn" href="/carrinho.html">Sacola (<span data-cart-count>0</span>)</a></div></div></header><section class="page-hero"><div class="container"><span class="eyebrow">RASTREAMENTO</span><h1>Acompanhe seu pedido</h1></div></section><main class="container"><div class="panel track-box"><form id="track" class="form-grid"><div class="field"><label>Código do pedido</label><input name="id" placeholder="GS-ABC123" required></div><div class="field"><label>E-mail da compra</label><input name="email" type="email" required></div><div class="field full"><button class="btn btn-primary">Consultar pedido</button></div></form><div id="track-result" class="result"></div></div></main><script src="/assets/app.js"></script><script>document.querySelector('#track').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const box=document.querySelector('#track-result');box.innerHTML='<p class="muted">Consultando...</p>';const r=await fetch(`/api/orders/${encodeURIComponent(d.id)}?email=${encodeURIComponent(d.email)}`);const o=await r.json();if(!r.ok){box.innerHTML=`<div class="notice">${o.detail||'Pedido não encontrado.'}</div>`;return}box.innerHTML=`<hr style="border:0;border-top:1px solid var(--border);margin:1.5rem 0"><span class="status">${o.status_label}</span><h2>Pedido ${o.public_id}</h2><p class="muted">Criado em ${new Date(o.created_at+'Z').toLocaleString('pt-BR')}</p>${o.items.map(i=>`<div class="total-line"><span>${i.quantity}× ${i.name}</span><b>${money(i.unit_price*i.quantity)}</b></div>`).join('')}<div class="total-line grand"><span>Total</span><span>${money(o.total)}</span></div>${o.tracking_code?`<p><strong>Rastreio:</strong> ${o.tracking_code}</p>`:''}${o.video_url?`<p><a class="btn btn-secondary" href="${o.video_url}" target="_blank" rel="noopener">Assistir à revelação</a></p>`:''}`};</script></body></html>
