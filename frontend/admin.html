<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Gabora Scoop</title><link rel="stylesheet" href="/assets/styles.css"></head><body><div class="topbar">Painel demonstrativo — autenticação será adicionada na versão de produção</div><header class="header"><div class="header-main"><a class="logo" href="/"><img src="/assets/logo.jfif" alt="Logo">GABORA SCOOP</a><div></div><a class="icon-btn" href="/">Ver loja</a></div></header><section class="page-hero"><div class="container"><span class="eyebrow">ADMINISTRAÇÃO</span><h1>Pedidos</h1><p class="muted">Atualize o andamento, rastreio e link da gravação.</p></div></section><main class="container section"><div class="panel admin-scroll"><table class="admin-table"><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th><th>Ação</th></tr></thead><tbody id="orders"></tbody></table></div></main><script src="/assets/app.js"></script><script>const labels={pago:'Pagamento confirmado',aguardando_preparacao:'Aguardando preparação',em_preparacao:'Em preparação',preparado:'Preparado',enviado:'Enviado',entregue:'Entregue',cancelado:'Cancelado'};async function load(){const r=await fetch('/api/admin/orders'),data=await r.json(),body=document.querySelector('#orders');body.innerHTML=data.length?data.map(o=>`<tr><td><b>${o.public_id}</b><br><small>${o.email}</small></td><td>${o.customer_name}</td><td>${money(o.total)}</td><td><select id="s-${o.public_id}">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="btn btn-secondary" onclick="update('${o.public_id}')">Salvar</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum pedido criado.</td></tr>'}async function update(id){const status=document.querySelector('#s-'+id).value;const r=await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast(r.ok?'Pedido atualizado':'Não foi possível atualizar')}load();</script></body></html>
